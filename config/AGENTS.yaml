# AGENTS.yaml — roster declarativo de agentes
# (BOOTSTRAP + CLAUDE-EXECUTION-001 + CLAUDE-EXECUTION-002)
#
# Fuente de verdad: 01_MASTER_SPEC.md §2, §7, §13.
# El Director permanece deshabilitado (enabled: false): D1/D2 (§0) reservan
# su conexión programática vía OpenAI API a un incremento posterior.
# El Developer se habilita en CLAUDE-EXECUTION-001 EXCLUSIVAMENTE para un
# handshake seguro y no interactivo con Claude Code CLI (--permission-mode
# plan + --restricted, sin edición, sin Bash):
# ver src/orchestrator/adapters/claude_code.py.
# write_probe (CLAUDE-EXECUTION-002) es una configuración SEPARADA y
# explícita para una única escritura determinista dentro de un sandbox
# efímero (--permission-mode acceptEdits + --restricted). No sustituye ni
# debilita el handshake read-only anterior, que sigue exclusivamente en
# "plan".
# No incluir API keys, secretos ni credenciales en este archivo.

version: 1

agents:
  director:
    role: "director"
    provider: "openai_api"
    port: "DirectorPort"
    enabled: false

  developer:
    role: "developer"
    provider: "claude_code_cli"
    port: "DeveloperPort"
    enabled: true
    # Nombre de ejecutable a resolver vía shutil.which(); nunca una ruta
    # hardcodeada específica del usuario.
    executable: "claude"
    output_format: "json"
    # CLAUDE-EXECUTION-001: handshake mínimo, un solo turno.
    max_turns: 1
    timeout_seconds: 60
    # Único modo autorizado en este incremento: sin edición, sin Bash.
    permission_mode: "plan"
    # Defensa en profundidad (CORRECTION-001): permission_mode plan no es la
    # única barrera; restricted quita las herramientas que ejecutan
    # comandos/código (Bash, PowerShell, REPL, etc.). No es un default
    # silencioso: config_loader exige explícitamente restricted: true.
    restricted: true

    # CLAUDE-EXECUTION-002: sandbox de escritura controlada. permission_mode
    # y restricted PROPIOS, independientes de los de arriba (que siguen en
    # "plan"). executable/output_format se reutilizan de este mismo bloque
    # developer, sin duplicarse. write_probe es una prueba mínima
    # determinista (un solo archivo, un texto exacto): su presupuesto de
    # turnos NUNCA debe reutilizarse como presupuesto operacional de una
    # tarea de desarrollo genérica (ver task_execution más abajo).
    write_probe:
      enabled: true
      permission_mode: "acceptEdits"
      restricted: true
      # Un solo turno: modificar TARGET.txt y responder. Pequeño y acotado.
      max_turns: 3
      timeout_seconds: 90

    # TASK-EXECUTION-005: presupuesto SEPARADO e independiente para la
    # ejecución de un Developer Task Packet genérico (run_developer_task).
    # permission_mode/restricted comparten el mismo valor que write_probe
    # (acceptEdits + restricted) porque ambos autorizan edición real, pero
    # max_turns/timeout_seconds son PROPIOS: una instrucción de desarrollo
    # arbitraria (EXECUTION-DIAG-002) puede necesitar más turnos agentic que
    # la escritura mínima determinista del write_probe. executable/
    # output_format se reutilizan de este mismo bloque developer, sin
    # duplicarse. Cambiar este bloque NUNCA afecta write_probe ni el
    # handshake, y viceversa.
    task_execution:
      enabled: true
      permission_mode: "acceptEdits"
      restricted: true
      max_turns: 8
      timeout_seconds: 90

    # CAPACITY-RESUME-FOUNDATION-001: espera automática ante una señal
    # ESTRUCTURADA de capacidad de Claude (CLAUDE_TEMPORARY_LIMIT). Solo
    # configuración: el motor todavía no suspende ni reanuda (incremento
    # posterior). Si este bloque falta, equivale a auto_wait desactivado.
    # Unidades: segundos. Límites validados por config_loader (fail-closed):
    # retry_interval_seconds 60..86400, max_attempts 1..100,
    # max_wait_seconds >= retry_interval_seconds y <= 604800.
    capacity_wait:
      auto_wait: true
      retry_interval_seconds: 1800   # 30 minutos entre reintentos de capacidad
      max_attempts: 12               # suspensiones/reintentos de capacidad
      max_wait_seconds: 28800        # 8 horas máximas desde la primera suspensión
