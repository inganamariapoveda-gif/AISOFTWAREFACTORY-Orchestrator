# AGENTS.yaml — roster declarativo de agentes
# (BOOTSTRAP + CLAUDE-EXECUTION-001 + CLAUDE-EXECUTION-002)
#
# Fuente de verdad: 01_MASTER_SPEC.md §2, §7, §13.
# El Director permanece deshabilitado (enabled: false): D1/D2 (§0) reservan
# su conexión programática vía OpenAI API a un incremento posterior.
# El Developer se habilita en CLAUDE-EXECUTION-001 EXCLUSIVAMENTE para un
# handshake seguro y no interactivo con Claude Code CLI (--permission-mode
# plan + --restricted, sin edición, sin Bash):
# ver src/orchestrator/adapters/claude_code.py.
# write_probe (CLAUDE-EXECUTION-002) es una configuración SEPARADA y
# explícita para una única escritura determinista dentro de un sandbox
# efímero (--permission-mode acceptEdits + --restricted). No sustituye ni
# debilita el handshake read-only anterior, que sigue exclusivamente en
# "plan".
# No incluir API keys, secretos ni credenciales en este archivo.

version: 1

agents:
  director:
    role: "director"
    provider: "openai_api"
    port: "DirectorPort"
    enabled: false

  developer:
    role: "developer"
    provider: "claude_code_cli"
    port: "DeveloperPort"
    enabled: true
    # Nombre de ejecutable a resolver vía shutil.which(); nunca una ruta
    # hardcodeada específica del usuario.
    executable: "claude"
    output_format: "json"
    # CLAUDE-EXECUTION-001: handshake mínimo, un solo turno.
    max_turns: 1
    timeout_seconds: 60
    # Único modo autorizado en este incremento: sin edición, sin Bash.
    permission_mode: "plan"
    # Defensa en profundidad (CORRECTION-001): permission_mode plan no es la
    # única barrera; restricted quita las herramientas que ejecutan
    # comandos/código (Bash, PowerShell, REPL, etc.). No es un default
    # silencioso: config_loader exige explícitamente restricted: true.
    restricted: true

    # CLAUDE-EXECUTION-002: sandbox de escritura controlada. permission_mode
    # y restricted PROPIOS, independientes de los de arriba (que siguen en
    # "plan"). executable/output_format se reutilizan de este mismo bloque
    # developer, sin duplicarse.
    write_probe:
      enabled: true
      permission_mode: "acceptEdits"
      restricted: true
      # Un solo turno: modificar TARGET.txt y responder. Pequeño y acotado.
      max_turns: 3
      timeout_seconds: 90
