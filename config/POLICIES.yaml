# POLICIES.yaml — reglas generales e invariantes del sistema (BOOTSTRAP)
#
# Fuente de verdad: 01_MASTER_SPEC.md §7, §8, §10, §14.
# El motor falla cerrado si este archivo falta o es inválido.

version: 1

prohibitions:
  production: true
  uncontrolled_git_push: true
  git_merge: true
  irreversible_actions: true

# Declarative governance only; operational publication is not implemented.
controlled_actions:
  git_publish_task_branch:
    enabled: true
    classification: "AMARILLO"
    approval: "DIRECTOR_INTERNAL_GATE"
    on_violation: "BLOCKED"

attempts:
  # Límite configurable de intentos de corrección antes de BLOCKED (§14).
  max_correction_attempts: 3

classification:
  levels: ["VERDE", "AMARILLO", "ROJO"]
  # Una acción no clasificada NO hereda silenciosamente un nivel aprobable:
  # se detiene y escala (§0, §8). Único valor válido: "BLOCKED".
  on_unclassified: "BLOCKED"

# Ante ambigüedad o contradicción entre reglas, el sistema detiene la
# ejecución en vez de continuar con un comportamiento permisivo (§10).
fail_closed: true

# fine_grained_pat_dpapi is MVP-only. github_app_installation_token MUST
# replace it before production, multi-client operation or commercial customers.
safe_test_backend:
  provider: github_actions
  activation: disabled
  credential_strategy:
    mvp: fine_grained_pat_dpapi
    production_required: github_app_installation_token
    github_app_required_before:
      - production
      - multi_client
      - commercial_external_customer
  github:
    repository: inganamariapoveda-gif/AISOFTWAREFACTORY-Orchestrator
    workflow_id: safe-test-runner.yml
    workflow_ref: main
    api_version: "2026-03-10"
    return_run_details: true

# Operational runs only; manual stateless probes retain their own limits.
resource_budget:
  default_profile: standard
  exhaustion_behavior: BLOCKED
  profiles:
    economy:
      max_builder_invocations: 2
      max_verifier_invocations: 1
      max_correction_attempts: 1
      max_total_model_invocations: 3
    standard:
      max_builder_invocations: 3
      max_verifier_invocations: 2
      max_correction_attempts: 2
      max_total_model_invocations: 5
    high_assurance:
      max_builder_invocations: 4
      max_verifier_invocations: 3
      max_correction_attempts: 3
      max_total_model_invocations: 7
