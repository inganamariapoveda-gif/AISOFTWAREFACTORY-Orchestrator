# POLICIES.yaml — reglas generales e invariantes del sistema (BOOTSTRAP)
#
# Fuente de verdad: 01_MASTER_SPEC.md §7, §8, §10, §14.
# El motor falla cerrado si este archivo falta o es inválido.

version: 1

prohibitions:
  production: true
  git_push: true
  git_merge: true
  irreversible_actions: true

attempts:
  # Límite configurable de intentos de corrección antes de BLOCKED (§14).
  max_correction_attempts: 3

classification:
  levels: ["VERDE", "AMARILLO", "ROJO"]
  # Una acción no clasificada NO hereda silenciosamente un nivel aprobable:
  # se detiene y escala (§0, §8). Único valor válido: "BLOCKED".
  on_unclassified: "BLOCKED"

# Ante ambigüedad o contradicción entre reglas, el sistema detiene la
# ejecución en vez de continuar con un comportamiento permisivo (§10).
fail_closed: true
