# PERMISSIONS.yaml — mínimo privilegio (BOOTSTRAP)
#
# Fuente de verdad: 01_MASTER_SPEC.md §7, §10.
# El motor falla cerrado si este archivo falta o es inválido.

version: 1

deny:
  production: true
  git_push: true
  git_merge: true
  irreversible_actions: true
  env_files: true
  secret_files: true

# TASK-EXECUTION-002 (D-EXEC-001): lista CERRADA de IDs lógicos autorizados
# GLOBALMENTE (nunca argv, nunca un string de shell). Para que un
# mandatory_test pueda ejecutarse hace falta la INTERSECCIÓN obligatoria de
# TaskPacket.mandatory_tests ∩ PERMISSIONS.allowed_commands ∩
# PROJECT_RULES.commands.keys(); PROJECT_RULES.commands[id] produce
# entonces el argv preautorizado. Cualquier ID ausente de esta lista queda
# prohibido por defecto (fail closed), sin importar lo que declare
# PROJECT_RULES de un proyecto.
allowed_commands:
  - unit
  - lint
  - build

# Additional prerequisite; never overrides scope, commands, paths or denials.
role_capabilities:
  builder:
    - implement_authorized_changes
  director: []
  verifier: []
