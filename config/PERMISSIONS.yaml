# PERMISSIONS.yaml — mínimo privilegio (BOOTSTRAP)
#
# Fuente de verdad: 01_MASTER_SPEC.md §7, §10.
# El motor falla cerrado si este archivo falta o es inválido.

version: 1

deny:
  production: true
  uncontrolled_git_push: true
  git_merge: true
  irreversible_actions: true
  env_files: true
  secret_files: true

# Capability alone never authorizes publication. Exact URL comparison required.
git_publish:
  enabled: true
  remote_name: "origin"
  allowed_remote_urls:
    - "https://github.com/inganamariapoveda-gif/AISOFTWAREFACTORY-Orchestrator.git"
  branch_prefix: "task/"
  forbidden_branches:
    - "main"
    - "master"
  allow_force: false
  allow_tags: false
  allow_delete: false
  require_explicit_task_packet: true
  require_director_approval: true
  require_clean_worktree: true
  refspec_mode: "current_branch_only"

# Separate trust primitive; never widens git_publish.
git_tag_publish:
  enabled: true
  remote_name: origin
  allowed_repository_url: https://github.com/inganamariapoveda-gif/AISOFTWAREFACTORY-Orchestrator.git
  allowed_tag_ref: refs/tags/safe-test-runner-v1
  allowed_target_sha: db38ef6e6cbc73d8e54b591d4f0eb747073d500b
  allowed_target_tree: a0e83537b75fa4341d6e32b477ff07adec4cda1c
  tag_type: lightweight
  create_only: true
  allow_update: false
  allow_delete: false
  allow_force: false
  require_explicit_task_packet: true
  require_director_approval: true
  require_clean_worktree: true
  require_verified_protective_ruleset: true
  protective_ruleset:
    id: 25739744
    name: protect-safe-test-runner-v1
    target: tag
    enforcement: active
    include: refs/tags/safe-test-runner-v1
    rules: [deletion, update]
    bypass_actors: []
    current_user_can_bypass: never
    creation_restricted: false

execution_controls:
  local_project_commands: false

# TASK-EXECUTION-002 (D-EXEC-001): lista CERRADA de IDs lógicos autorizados
# GLOBALMENTE (nunca argv, nunca un string de shell). Para que un
# mandatory_test pueda resolverse como datos hace falta la INTERSECCIÓN de
# TaskPacket.mandatory_tests ∩ PERMISSIONS.allowed_commands ∩
# PROJECT_RULES.commands.keys(); PROJECT_RULES.commands[id] produce
# entonces argv como datos, nunca autorización de ejecución local. Cualquier ID ausente queda
# prohibido por defecto (fail closed), sin importar lo que declare
# PROJECT_RULES de un proyecto.
allowed_commands:
  - unit
  - lint
  - build

# Additional prerequisite; never overrides scope, commands, paths or denials.
role_capabilities:
  builder:
    - implement_authorized_changes
    - publish_authorized_task_branch
    - publish_authorized_safe_test_source_tag
  director: []
  verifier: []
